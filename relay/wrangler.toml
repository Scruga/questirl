name = "questirl-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

# Cloudflare disabled the workers.dev subdomain by default for new
# workers in 2024 — explicitly opt in so every deploy keeps the public
# URL alive.
workers_dev = true

# Allowed origins — comma-separated. For local testing you can set "*"
# but in production set this to your deploy URL(s).
[vars]
ALLOWED_ORIGINS = "https://questirl.gg,https://sage-crumble-a39c95.netlify.app"

# API keys are SECRETS — set them via wrangler secret put.
# Never put them in this file. Never commit them anywhere.
#   wrangler secret put ANTHROPIC_API_KEY    # required for / route
#   wrangler secret put OPENAI_API_KEY       # optional; required for /openai route
#
# For LOCAL dev (wrangler dev), create relay/.dev.vars (gitignored):
#   ANTHROPIC_API_KEY=sk-ant-...
#   OPENAI_API_KEY=sk-proj-...
